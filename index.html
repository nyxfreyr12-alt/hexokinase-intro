<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hexokinase | 1A BSN Group 3</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(circle at center, #142b5c 0%, #07132e 55%, #020817 100%);
    color: white;
}


/* =========================
   STARS
========================= */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        radial-gradient(2px 2px at 10% 20%, white, transparent),
        radial-gradient(1.5px 1.5px at 30% 70%, white, transparent),
        radial-gradient(2px 2px at 50% 30%, white, transparent),
        radial-gradient(1.5px 1.5px at 70% 80%, white, transparent),
        radial-gradient(2px 2px at 90% 25%, white, transparent),
        radial-gradient(1px 1px at 80% 50%, white, transparent),
        radial-gradient(1.5px 1.5px at 20% 90%, white, transparent);

    opacity: 0.7;
}


/* =========================
   WELCOME SCREEN
========================= */

#welcomeScreen {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    cursor: pointer;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}

#welcomeScreen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.welcome {
    font-size: clamp(50px, 10vw, 110px);

    font-weight: 900;
    letter-spacing: 8px;

    text-shadow:
        0 0 10px #ffffff,
        0 0 25px #4da6ff,
        0 0 50px #1677ff;

    animation:
        welcomePulse 2s infinite alternate;
}

.click-text {
    margin-top: 25px;

    font-size: 16px;
    letter-spacing: 4px;

    opacity: 0.75;

    animation:
        blink 1.5s infinite;
}

@keyframes welcomePulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }

}

@keyframes blink {

    50% {
        opacity: 0.35;
    }

}


/* =========================
   JIMMY
========================= */

#jimmy {

    position: fixed;

    width: min(520px, 45vw);

    left: 0;
    top: 0;

    z-index: 10;

    pointer-events: none;

    visibility: hidden;

    /*
       Start small and far away
    */

    transform:
        translate(-70vw, -45vh)
        scale(0.25)
        rotate(-8deg);
}


/* =========================
   JIMMY FLIES IN
========================= */

#jimmy.fly-in {

    visibility: visible;

    animation:
        flyIn 2s cubic-bezier(.2,.75,.25,1) forwards;
}


@keyframes flyIn {

    0% {

        transform:
            translate(-70vw, -45vh)
            scale(0.25)
            rotate(-8deg);

    }

    70% {

        transform:
            translate(42vw, 34vh)
            scale(1.08)
            rotate(2deg);

    }

    100% {

        transform:
            translate(50vw, 50vh)
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);

    }

}


/* =========================
   JIMMY PAUSE
========================= */

#jimmy.pause {

    visibility: visible;

    transform:
        translate(50vw, 50vh)
        translate(-50%, -50%)
        scale(1);

    animation:
        gentleFloat 1.5s ease-in-out infinite alternate;
}


@keyframes gentleFloat {

    from {

        margin-top: -5px;

    }

    to {

        margin-top: 5px;

    }

}


/* =========================
   JIMMY FLIES OUT
========================= */

#jimmy.fly-out {

    visibility: visible;

    animation:
        flyOut 1.1s cubic-bezier(.7,.05,1,.3) forwards;
}


@keyframes flyOut {

    0% {

        transform:
            translate(50vw, 50vh)
            translate(-50%, -50%)
            scale(1);

    }

    100% {

        transform:
            translate(125vw, 50vh)
            translate(-50%, -50%)
            scale(1.05);

    }

}


/* =========================
   JIMMY TEXT
========================= */

#jimmyText {

    position: fixed;

    left: 50%;
    top: 72%;

    transform: translateX(-50%);

    z-index: 20;

    font-size: clamp(18px, 3vw, 30px);

    font-weight: bold;

    letter-spacing: 5px;

    text-align: center;

    color: white;

    text-shadow:
        0 0 8px #ffffff,
        0 0 20px #3ca8ff;

    opacity: 0;

    transition:
        opacity 0.4s ease;
}


#jimmyText.show {

    opacity: 1;

}


/* =========================
   MAIN MENU
========================= */

#mainMenu {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}


#mainMenu.show {

    opacity: 1;
    visibility: visible;

}


/* =========================
   TITLE
========================= */

.title {

    font-size:
        clamp(45px, 8vw, 90px);

    font-weight: 900;

    letter-spacing: 5px;

    color: white;

    text-shadow:
        0 0 10px #ffffff,
        0 0 25px #45a8ff,
        0 0 50px #146fff;

    margin-bottom: 10px;

}


.subtitle {

    font-size: 15px;

    letter-spacing: 5px;

    opacity: 0.7;

    margin-bottom: 45px;

}


/* =========================
   NAVIGATION
========================= */

.navigation {

    width: min(850px, 90%);

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

}


.nav-button {
    display: block;
    width: 280px;
    padding: 14px 20px;
    margin: 10px auto;
    background: #C93638;
    color: #F6FFEA;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    border: 2px solid #C93638;
    border-radius: 10px;
    transition: all 0.25s ease;
    box-shadow: 0 0 10px rgba(201, 54, 56, 0.4);
}

.nav-button:hover {
    background: #FA855A;
    color: #F6FFEA;
    border-color: #FA855A;
    transform: scale(1.04);
    box-shadow:
        0 0 8px #FA855A,
        0 0 18px #FA855A,
        0 0 30px rgba(250, 133, 90, 0.7);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .navigation {

        grid-template-columns: 1fr;

        gap: 10px;

    }

    .nav-button {

        padding: 14px;

        font-size: 13px;

    }

    .subtitle {

        margin-bottom: 25px;

    }

    #jimmy {

        width: 75vw;

    }

}

</style>
</head>


<body>

<div class="stars"></div>


<!-- =========================
     WELCOME
========================= -->

<div id="welcomeScreen">

    <div class="welcome">
        WELCOME
    </div>

    <div class="click-text">
        CLICK ANYWHERE TO ENTER
    </div>

</div>


<!-- =========================
     JIMMY
========================= -->

<img
    id="jimmy"
    src="jimmy-rocket.png"
    alt="Jimmy Neutron flying on a rocket"
>


<!-- =========================
     JIMMY TEXT
========================= -->

<div id="jimmyText">
    INITIALIZING...
</div>


<!-- =========================
     MAIN MENU
========================= -->

<div id="mainMenu">

    <div class="title">
        HEXOKINASE
    </div>

    <div class="subtitle">
        EXPLORE THE STRUCTURE
    </div>


<div class="navigation">

    <a
        class="nav-button"
        href="https://sites.google.com/cghc.edu.ph/hekstatic-protein/introduction"
        target="_top"
    >
        INTRODUCTION
    </a>


    <a
        class="nav-button"
        href="https://sites.google.com/cghc.edu.ph/hekstatic-protein/primary-structure?"
        target="_top"
    >
        PRIMARY STRUCTURE
    </a>


    <a
        class="nav-button"
        href="https://sites.google.com/cghc.edu.ph/hekstatic-protein/secondary-structure"
        target="_top"
    >
        SECONDARY STRUCTURE
    </a>


    <a
        class="nav-button"
        href="https://sites.google.com/cghc.edu.ph/hekstatic-protein/tertiary-structure"
        target="_top"
    >
        TERTIARY STRUCTURE
    </a>


    <a
        class="nav-button"
        href="https://sites.google.com/cghc.edu.ph/hekstatic-protein/quarternary-structure"
        target="_top"
    >
        QUATERNARY STRUCTURE
    </a>


    <a
        class="nav-button"
        href="https://sites.google.com/cghc.edu.ph/hekstatic-protein/abouts-us"
        target="_top"
    >
        ABOUT US
    </a>

</div>
</div>


<script>

/* =========================
   ELEMENTS
========================= */

const welcomeScreen =
    document.getElementById("welcomeScreen");

const jimmy =
    document.getElementById("jimmy");

const jimmyText =
    document.getElementById("jimmyText");

const mainMenu =
    document.getElementById("mainMenu");


/* =========================
   START INTRO
========================= */

welcomeScreen.addEventListener(
    "click",
    startIntro
);


function startIntro() {

    /*
       Hide WELCOME
    */

    welcomeScreen.classList.add(
        "hidden"
    );


    /*
       Jimmy flies in
       small → big
    */

    jimmy.classList.add(
        "fly-in"
    );


    /*
       Jimmy reaches center
    */

    setTimeout(() => {

        jimmy.classList.remove(
            "fly-in"
        );

        jimmy.classList.add(
            "pause"
        );

        /*
           Show INITIALIZING
        */

        jimmyText.classList.add(
            "show"
        );

    }, 2000);


    /*
       After Jimmy has been
       steady for a while,
       change text to
       GOTTA BLAST!
    */

    setTimeout(() => {

        jimmyText.textContent =
            "GOTTA BLAST!";

    }, 4000);


    /*
       Jimmy shoots toward
       the right side
    */

    setTimeout(() => {

        jimmy.classList.remove(
            "pause"
        );

        jimmy.classList.add(
            "fly-out"
        );

        /*
           Hide text as Jimmy leaves
        */

        jimmyText.classList.remove(
            "show"
        );

    }, 4400);


    /*
       Reveal HEXOKINASE
    */

    setTimeout(() => {

        mainMenu.classList.add(
            "show"
        );

    }, 5500);

}

</script>

</body>
</html>
